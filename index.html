<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MR. VAGINA HEAD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1a0e08" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #000;
    color: #f5e8c8;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }

  /* ---------- TITLE BAR ---------- */
  #title-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    padding: calc(env(safe-area-inset-top, 0px) + 0.7rem) 1rem 0.8rem;
    background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.4) 70%, transparent);
    pointer-events: none;
    text-align: center;
  }
  #title-bar h1 {
    font-family: 'Georgia', serif;
    font-size: clamp(1rem, 4.5vw, 1.7rem);
    letter-spacing: 0.35em;
    color: #f5e8c8;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    font-weight: 700;
  }

  /* ---------- SCENES ---------- */
  .scene {
    position: absolute;
    inset: 0;
    transition: opacity 1.1s ease;
  }
  .scene.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ============================================================
     SHOP SCENE — fancy menswear (mobile-first stacked layout)
     ============================================================ */
  #shop-scene {
    background:
      radial-gradient(ellipse at 50% 22%, rgba(255, 210, 140, 0.22), transparent 65%),
      linear-gradient(180deg, #1a0e08 0%, #2b1810 55%, #120902 100%);
  }
  .wood-wall {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 78%;
    background:
      repeating-linear-gradient(90deg,
        #3a2418 0px,
        #4a2e1f 90px,
        #321b10 180px,
        #2a1610 270px),
      linear-gradient(180deg, #2a1810, #1a0f08);
    border-bottom: 6px solid #0d0603;
    box-shadow:
      inset 0 -30px 60px rgba(0,0,0,0.7),
      inset 0 60px 80px rgba(255, 180, 90, 0.06);
    pointer-events: none;
  }
  .wood-wall::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 16%;
    height: 5px;
    background: linear-gradient(180deg, #c9a55e, #8a6f3a);
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .wood-wall::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    height: 8px;
    background: linear-gradient(180deg, #8a6f3a, #4a3a1e);
  }
  .floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 22%;
    background:
      repeating-linear-gradient(90deg,
        #2a1810 0,
        #1f100a 110px,
        #2a1810 220px);
    box-shadow:
      inset 0 30px 60px rgba(0,0,0,0.8),
      inset 0 -20px 30px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  .shop-layout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    z-index: 5;
    padding:
      calc(env(safe-area-inset-top, 0px) + 3rem)
      max(0.7rem, env(safe-area-inset-right, 0px))
      max(0.7rem, env(safe-area-inset-bottom, 0px))
      max(0.7rem, env(safe-area-inset-left, 0px));
    gap: 0.6rem;
  }

  /* ----- HEADER (sign + lamps) ----- */
  .shop-header {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    position: relative;
    padding-top: 0.4rem;
  }
  .lamp {
    position: absolute;
    top: -4px;
    width: 22px;
    height: 12px;
    background: linear-gradient(180deg, #c9a55e, #6a4a20);
    border-radius: 50% 50% 30% 30% / 100% 100% 30% 30%;
    box-shadow: 0 0 22px rgba(255, 200, 100, 0.7);
  }
  .lamp.left  { left: calc(50% - 100px); }
  .lamp.right { left: calc(50% + 78px); }
  @media (max-width: 480px) {
    .lamp { display: none; }
  }

  .sign {
    padding: 0.55rem clamp(1.2rem, 5vw, 3.2rem);
    background: linear-gradient(180deg, #2a1810, #160a04);
    border: 3px solid #c9a55e;
    outline: 1px solid #c9a55e;
    outline-offset: 4px;
    border-radius: 6px;
    box-shadow:
      0 0 40px rgba(255, 190, 90, 0.32),
      inset 0 0 30px rgba(255, 200, 120, 0.12),
      0 8px 18px rgba(0,0,0,0.6);
    text-align: center;
  }
  .sign h2 {
    font-family: 'Georgia', serif;
    font-size: clamp(1.4rem, 6vw, 2.6rem);
    letter-spacing: 0.35em;
    color: #f0c674;
    text-shadow:
      0 0 12px rgba(255, 200, 90, 0.7),
      0 0 28px rgba(255, 150, 50, 0.45),
      0 2px 0 rgba(0,0,0,0.4);
    padding-left: 0.35em;
  }
  .sign .tag {
    color: #c9a55e;
    font-size: clamp(0.55rem, 1.8vw, 0.7rem);
    font-style: italic;
    letter-spacing: 0.25em;
    margin-top: 0.3rem;
    opacity: 0.85;
  }

  /* ----- MAIN (head grid) ----- */
  .shop-main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
  }
  .head-display {
    width: 100%;
    max-width: 720px;
    background:
      linear-gradient(180deg, rgba(20, 10, 5, 0.7), rgba(10, 5, 2, 0.88)),
      repeating-linear-gradient(0deg,
        rgba(0,0,0,0.2) 0, rgba(0,0,0,0.2) 1px,
        transparent 1px, transparent 30px);
    border: 3px double #c9a55e;
    border-radius: 6px;
    padding: 0.7rem 0.8rem;
    box-shadow:
      0 14px 36px rgba(0,0,0,0.7),
      inset 0 0 24px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .display-title {
    color: #f0c674;
    text-align: center;
    font-style: italic;
    font-size: clamp(0.6rem, 1.9vw, 0.85rem);
    letter-spacing: 0.25em;
    margin-bottom: 0.55rem;
    opacity: 0.85;
    flex: 0 0 auto;
  }
  .head-grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 0.4rem 0.5rem;
    min-height: 0;
  }

  .head-option {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    cursor: pointer;
    padding: 0.3rem 0.15rem;
    border-radius: 8px;
    transition: background 0.2s, transform 0.15s;
    min-height: 0;
    /* Larger tap target */
    -webkit-tap-highlight-color: rgba(240, 198, 116, 0.2);
  }
  .head-option:active {
    transform: scale(0.94);
    background: rgba(255, 200, 110, 0.12);
  }
  @media (hover: hover) {
    .head-option:hover {
      background: rgba(255, 200, 110, 0.08);
      transform: translateY(-2px);
    }
  }
  .head-option .head-disc {
    width: clamp(48px, 13vw, 96px);
    height: clamp(48px, 13vw, 96px);
    border-radius: 50%;
    background-image: url('heads.png');
    background-repeat: no-repeat;
    border: 2px solid #c9a55e;
    box-shadow:
      0 4px 10px rgba(0,0,0,0.6),
      inset 0 0 0 1px rgba(255,255,255,0.1);
    transition: box-shadow 0.2s, border-color 0.2s;
    flex: 0 0 auto;
  }
  @media (hover: hover) {
    .head-option:hover .head-disc {
      box-shadow: 0 0 22px rgba(240, 198, 116, 0.85), inset 0 0 0 1px rgba(255,255,255,0.2);
      border-color: #f5d68a;
    }
  }
  .head-option.chosen .head-disc {
    border-color: #fff;
    box-shadow: 0 0 24px rgba(255, 220, 140, 1);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 18px rgba(255, 220, 140, 0.8); }
    50%      { box-shadow: 0 0 32px rgba(255, 220, 140, 1); }
  }
  .head-option .label {
    margin-top: 0.3rem;
    font-size: clamp(0.52rem, 1.6vw, 0.72rem);
    line-height: 1.15;
    color: #e9c98a;
    text-align: center;
    font-style: italic;
    letter-spacing: 0.02em;
    min-height: 1.8em;
    flex: 0 0 auto;
  }

  /* ----- FOOTER (character + button) ----- */
  .shop-footer {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.6rem;
    padding: 0.2rem 0.2rem 0;
    min-height: 0;
  }

  .character {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
  }
  .character .head {
    width: clamp(48px, 14vw, 96px);
    height: clamp(48px, 14vw, 96px);
    border-radius: 50%;
    background: linear-gradient(160deg, #f4d4b0 0%, #d4a87a 100%);
    border: 3px solid #1a0e08;
    background-image: url('heads.png');
    background-repeat: no-repeat;
    transition: width 0.4s, height 0.4s, background-size 0.4s, background-position 0.4s;
    box-shadow: 0 6px 16px rgba(0,0,0,0.6), inset 0 -6px 14px rgba(0,0,0,0.2);
    position: relative;
    z-index: 2;
  }
  .character .head.empty { background-image: none; }
  .character .head.empty::before,
  .character .head.empty::after {
    content: '';
    position: absolute;
    width: 9px;
    height: 9px;
    background: #1a0e08;
    border-radius: 50%;
    top: 42%;
  }
  .character .head.empty::before { left: 28%; }
  .character .head.empty::after  { right: 28%; }

  .character .neck {
    width: 22px;
    height: 10px;
    background: linear-gradient(180deg, #d4a87a, #a87a4a);
    border-left: 2px solid #1a0e08;
    border-right: 2px solid #1a0e08;
    margin-top: -3px;
    z-index: 1;
    position: relative;
  }
  .character .body {
    width: clamp(80px, 22vw, 160px);
    height: clamp(100px, 26vw, 180px);
    background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
    border: 2px solid #000;
    border-radius: 36% 36% 4px 4px / 14% 14% 4px 4px;
    margin-top: -2px;
    position: relative;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }
  .character .body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 55%;
    height: 38%;
    background: #f5f0e6;
    clip-path: polygon(50% 0%, 72% 100%, 28% 100%);
  }
  .character .body::after {
    content: '';
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 16%;
    height: 50%;
    background: linear-gradient(180deg, #b91c1c, #6f1010);
    clip-path: polygon(38% 0, 62% 0, 92% 100%, 8% 100%);
  }
  .pocket-sq {
    position: absolute;
    bottom: 45%;
    right: 14%;
    width: 9px;
    height: 9px;
    background: #f5e8c8;
    transform: rotate(45deg);
  }
  .character .legs {
    display: flex;
    gap: 3px;
    margin-top: -2px;
  }
  .character .legs .leg {
    width: clamp(20px, 5.5vw, 38px);
    height: clamp(40px, 11vw, 78px);
    background: linear-gradient(180deg, #1a1a1a, #000);
    border: 2px solid #000;
  }
  .character .shoes {
    display: flex;
    gap: 3px;
    margin-top: -2px;
  }
  .character .shoes .shoe {
    width: clamp(26px, 7vw, 48px);
    height: clamp(8px, 2vw, 14px);
    background: linear-gradient(180deg, #3a1f10, #1a0a04);
    border-radius: 50% 30% 4px 4px / 100% 100% 4px 4px;
    border: 2px solid #000;
  }

  /* Walk button */
  .walk-btn {
    padding: 0.85rem 1.25rem;
    background: linear-gradient(180deg, #f0c674 0%, #c9a55e 50%, #8a6f3a 100%);
    border: 3px double #1a0e08;
    color: #1a0e08;
    font-family: 'Georgia', serif;
    font-size: clamp(0.75rem, 2.6vw, 1.1rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    cursor: pointer;
    border-radius: 4px;
    box-shadow:
      0 6px 16px rgba(0,0,0,0.6),
      0 0 24px rgba(240, 198, 116, 0.35);
    transition: opacity 0.4s, transform 0.25s, box-shadow 0.25s;
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px);
    align-self: center;
    flex: 0 1 auto;
    white-space: nowrap;
  }
  .walk-btn.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .walk-btn:active { transform: translateY(2px); }
  @media (hover: hover) {
    .walk-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.7), 0 0 36px rgba(255, 220, 140, 0.7);
    }
  }

  .instruction {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
    left: 50%;
    transform: translateX(-50%);
    font-style: italic;
    color: rgba(240, 198, 116, 0.65);
    font-size: clamp(0.65rem, 2vw, 0.9rem);
    letter-spacing: 0.12em;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 10;
    white-space: nowrap;
    max-width: 90vw;
    text-overflow: ellipsis;
    overflow: hidden;
  }

  /* ---------- NOW PLAYING bar ---------- */
  .now-playing {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    padding: 0.55rem 0.9rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(10,5,2,0.92), rgba(0,0,0,0.98));
    border-top: 1px solid #c9a55e;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    z-index: 300;
    transform: translateY(110%);
    transition: transform 0.4s cubic-bezier(.34,1.36,.64,1);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .now-playing.show { transform: translateY(0); }
  .np-icon {
    flex: 0 0 auto;
    font-size: 1.2rem;
    color: #f0c674;
    animation: bounce 0.6s ease-in-out infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateY(0); }
    to   { transform: translateY(-4px); }
  }
  .np-text {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
  }
  .np-title {
    font-family: 'Georgia', serif;
    font-size: clamp(0.78rem, 3vw, 0.95rem);
    color: #f5e8c8;
    font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .np-artist {
    font-size: clamp(0.65rem, 2.4vw, 0.78rem);
    color: #c9a55e;
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .np-progress {
    flex: 0 0 80px;
    height: 4px;
    background: rgba(201, 165, 94, 0.25);
    border-radius: 2px;
    overflow: hidden;
  }
  .np-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f0c674, #ff9e3a);
    box-shadow: 0 0 8px rgba(240, 198, 116, 0.6);
  }
  @media (min-width: 600px) {
    .np-progress { flex: 0 0 160px; }
  }

  /* ============================================================
     NYC SCENE
     ============================================================ */
  #nyc-scene {
    background: linear-gradient(180deg,
      #ff7e5f 0%, #feb47b 22%, #ffd89b 42%,
      #f6c08b 55%, #c9a17a 75%, #6b4a3a 100%);
  }
  #nyc-scene::before {
    content: '';
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(120px, 30vw, 240px);
    height: clamp(120px, 30vw, 240px);
    background: radial-gradient(circle, rgba(255, 240, 200, 0.9) 0%, rgba(255, 200, 130, 0.4) 40%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .skyline {
    position: absolute;
    bottom: 24%;
    left: 0; right: 0;
    height: 60%;
    pointer-events: none;
  }
  .building {
    position: absolute;
    bottom: 0;
    background-color: #14142a;
    border-top: 2px solid #000;
    box-shadow:
      inset -16px 0 26px rgba(0,0,0,0.55),
      inset 0 8px 0 rgba(255, 200, 140, 0.12);
  }
  .building::before {
    content: '';
    position: absolute;
    inset: 16px 6px 10px 6px;
    background-image: radial-gradient(circle at 50% 50%, rgba(255, 220, 130, 0.85) 1.4px, transparent 2px);
    background-size: 12px 20px;
    opacity: 0.85;
  }
  .building.empire { background-color: #161630; }
  .building.empire::after {
    content: '';
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 50px solid #161630;
  }
  .antenna {
    position: absolute;
    top: -78px;
    left: 50%;
    width: 3px;
    height: 28px;
    background: #14142a;
    transform: translateX(-50%);
  }

  /* Liberty */
  .liberty {
    position: absolute;
    bottom: 24%;
    left: 4%;
    width: clamp(40px, 7vw, 70px);
    height: clamp(80px, 14vw, 140px);
    pointer-events: none;
    opacity: 0.85;
  }
  .liberty .body {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 40%;
    height: 55%;
    background: #4a6a55;
    clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
  }
  .liberty .head {
    position: absolute;
    bottom: 56%;
    left: 50%;
    transform: translateX(-50%);
    width: 28%;
    height: 14%;
    background: #4a6a55;
    border-radius: 50%;
  }
  .liberty .crown {
    position: absolute;
    bottom: 70%;
    left: 50%;
    transform: translateX(-50%);
    width: 50%;
    height: 12%;
    background: conic-gradient(from -30deg at 50% 100%,
      transparent 0, #4a6a55 10deg, transparent 20deg,
      transparent 30deg, #4a6a55 40deg, transparent 50deg,
      transparent 60deg, #4a6a55 70deg, transparent 80deg,
      transparent 90deg, #4a6a55 100deg, transparent 110deg,
      transparent 120deg, #4a6a55 130deg, transparent 140deg);
  }
  .liberty .torch {
    position: absolute;
    bottom: 72%;
    right: -6%;
    width: 12%;
    height: 24%;
    background: #4a6a55;
  }
  .liberty .flame {
    position: absolute;
    bottom: 92%;
    right: -10%;
    width: 22%;
    height: 14%;
    background: radial-gradient(ellipse, #ffd680 0%, #ff9e3a 70%, transparent 100%);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(255, 180, 80, 0.7);
  }

  .sidewalk {
    position: absolute;
    bottom: 18%;
    left: 0; right: 0;
    height: 6%;
    background:
      repeating-linear-gradient(90deg,
        #b5a591 0, #b5a591 40px,
        #9c8c78 40px, #9c8c78 80px),
      linear-gradient(180deg, #c0b09a, #8a7a64);
    border-top: 3px solid #5a4a38;
    border-bottom: 3px solid #3a2a18;
  }
  .nyc-street {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 18%;
    background: linear-gradient(180deg, #3a3a3a 0%, #1e1e1e 100%);
  }
  .nyc-street::before {
    content: '';
    position: absolute;
    top: 35%;
    left: 0; right: 0;
    height: 4px;
    background: repeating-linear-gradient(90deg,
      #f5d674 0, #f5d674 30px,
      transparent 30px, transparent 60px);
    box-shadow: 0 0 6px rgba(255, 220, 100, 0.4);
  }

  /* Cab */
  .cab {
    position: absolute;
    bottom: 4%;
    left: -200px;
    width: clamp(120px, 24vw, 180px);
    height: clamp(50px, 10vw, 70px);
    animation: cab-drive 14s linear infinite;
    z-index: 4;
  }
  .cab .body-c {
    position: absolute;
    bottom: 22%;
    width: 100%;
    height: 42%;
    background: linear-gradient(180deg, #ffd54a 0%, #e6a92a 100%);
    border: 2px solid #2a1a08;
    border-radius: 6px 8px 4px 4px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }
  .cab .top-c {
    position: absolute;
    bottom: 54%;
    left: 18%;
    width: 60%;
    height: 30%;
    background: linear-gradient(180deg, #ffd54a 0%, #e6a92a 100%);
    border: 2px solid #2a1a08;
    border-radius: 14px 14px 0 0;
  }
  .cab .top-c::before {
    content: '';
    position: absolute;
    inset: 4px 6px;
    background: linear-gradient(180deg, rgba(120, 180, 220, 0.85), rgba(60, 90, 130, 0.85));
    border-radius: 8px 8px 0 0;
  }
  .cab .top-c::after {
    content: 'TAXI';
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #000;
    font-family: 'Arial Black', sans-serif;
    font-size: 0.55rem;
    padding: 1px 5px;
    border: 1px solid #000;
    border-radius: 2px;
    letter-spacing: 0.1em;
  }
  .cab .wheel {
    position: absolute;
    bottom: 0;
    width: 22%;
    aspect-ratio: 1;
    background: radial-gradient(circle, #555 0%, #1a1a1a 60%);
    border: 2px solid #000;
    border-radius: 50%;
  }
  .cab .wheel.left  { left: 13%; }
  .cab .wheel.right { right: 13%; }
  @keyframes cab-drive {
    0%   { left: -25%; }
    100% { left: 110%; }
  }

  /* NYC character */
  .nyc-character {
    position: absolute;
    bottom: 23%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    animation: strut 1.6s ease-in-out infinite;
  }
  @keyframes strut {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-4px); }
  }
  .nyc-character .head {
    animation: head-bob 1.6s ease-in-out infinite;
  }
  @keyframes head-bob {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg); }
  }

  /* NPCs */
  .npc {
    position: absolute;
    bottom: 23%;
    width: clamp(50px, 10vw, 80px);
    z-index: 5;
    pointer-events: none;
  }
  .npc.left  { left: 8%; }
  .npc.right { right: 8%; }
  .npc .head {
    position: relative;
    margin: 0 auto;
    width: clamp(28px, 6vw, 42px);
    aspect-ratio: 1;
    background: radial-gradient(circle at 35% 35%, #f4d4b0, #b78850);
    border: 2px solid #1a0e08;
    border-radius: 50%;
  }
  .npc.right .head { background: radial-gradient(circle at 35% 35%, #d4a87a, #6a4828); }
  .npc .head::before, .npc .head::after {
    content: '';
    position: absolute;
    top: 40%;
    width: 14%; height: 14%;
    background: #1a0e08;
    border-radius: 50%;
  }
  .npc .head::before { left: 24%; }
  .npc .head::after  { right: 24%; }
  .npc .mouth {
    position: absolute;
    top: 62%;
    left: 50%;
    transform: translateX(-50%);
    width: 22%; height: 26%;
    background: #2a1010;
    border-radius: 50%;
  }
  .npc .body {
    margin: -2px auto 0;
    width: 80%;
    height: clamp(60px, 12vw, 100px);
    background: linear-gradient(180deg, #5a4a38, #2a1a08);
    border: 2px solid #000;
    border-radius: 30% 30% 4px 4px / 14% 14% 4px 4px;
  }
  .npc.right .body { background: linear-gradient(180deg, #4a3a5a, #1a0a2a); }
  .npc .speech {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #1a0e08;
    font-family: 'Georgia', serif;
    font-size: clamp(0.6rem, 2vw, 0.85rem);
    padding: 0.3rem 0.55rem;
    border: 2px solid #1a0e08;
    border-radius: 12px;
    white-space: nowrap;
    opacity: 0;
    animation: pop 0.5s 1.2s forwards;
  }
  @media (max-width: 480px) {
    .npc { display: none; }
  }
  @keyframes pop {
    0%   { opacity: 0; transform: translateX(-50%) scale(0.5); }
    70%  { opacity: 1; transform: translateX(-50%) scale(1.1); }
    100% { opacity: 1; transform: translateX(-50%) scale(1); }
  }

  /* Congrats card */
  .congrats {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 4rem);
    left: 50%;
    transform: translate(-50%, -20px) scale(0.85);
    width: min(92%, 480px);
    text-align: center;
    background: rgba(20, 10, 4, 0.82);
    padding: 1.4rem 1.4rem 1.2rem;
    border-radius: 10px;
    border: 3px double #f0c674;
    opacity: 0;
    transition: opacity 0.7s 0.4s, transform 0.7s 0.4s;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 10;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 40px rgba(240, 198, 116, 0.25);
  }
  .congrats.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  .congrats h2 {
    font-family: 'Georgia', serif;
    font-size: clamp(1.3rem, 5.5vw, 2.2rem);
    color: #f5e8c8;
    margin-bottom: 0.5rem;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .congrats p {
    font-style: italic;
    color: #f0c674;
    font-size: clamp(0.85rem, 3vw, 1.1rem);
    line-height: 1.45;
    letter-spacing: 0.03em;
  }
  .congrats p em { color: #fff; font-style: italic; }
  .replay {
    margin-top: 0.9rem;
    background: transparent;
    border: 1px solid #c9a55e;
    color: #f0c674;
    font-family: 'Georgia', serif;
    font-size: clamp(0.7rem, 2.4vw, 0.85rem);
    letter-spacing: 0.18em;
    padding: 0.55rem 1.1rem;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.2s, color 0.2s;
  }
  .replay:active { background: #c9a55e; color: #1a0e08; }
  @media (hover: hover) {
    .replay:hover { background: #c9a55e; color: #1a0e08; }
  }

  /* Hidden YT player — offscreen, not display:none (so audio still plays on mobile) */
  #ytPlayer {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 320px;
    height: 180px;
    opacity: 0;
    pointer-events: none;
  }

  /* Tablet / desktop polish */
  @media (min-width: 720px) and (min-height: 600px) {
    .shop-layout { gap: 1rem; }
    .shop-header { padding-top: 1rem; }
    .head-display { padding: 1rem 1.2rem; }
    .display-title { margin-bottom: 0.8rem; }
    .instruction { bottom: 12px; }
  }
  @media (min-width: 720px) {
    .head-option .head-disc {
      width: clamp(70px, 9vw, 110px);
      height: clamp(70px, 9vw, 110px);
    }
    .head-option .label { font-size: 0.78rem; }
  }
</style>
</head>
<body>

<div id="title-bar"><h1>MR. VAGINA HEAD</h1></div>

<!-- ========================== SHOP ========================== -->
<div id="shop-scene" class="scene">
  <div class="wood-wall"></div>
  <div class="floor"></div>

  <div class="shop-layout">
    <header class="shop-header">
      <div class="lamp left"></div>
      <div class="lamp right"></div>
      <div class="sign">
        <h2>GET HEAD</h2>
        <div class="tag">— bespoke fittings since '47 —</div>
      </div>
    </header>

    <main class="shop-main">
      <div class="head-display">
        <div class="display-title">— THE COLLECTION —</div>
        <div class="head-grid" id="headGrid"></div>
      </div>
    </main>

    <footer class="shop-footer">
      <div class="character" id="player">
        <div class="head empty" id="playerHead"></div>
        <div class="neck"></div>
        <div class="body"><div class="pocket-sq"></div></div>
        <div class="legs"><div class="leg"></div><div class="leg"></div></div>
        <div class="shoes"><div class="shoe"></div><div class="shoe"></div></div>
      </div>
      <button class="walk-btn" id="walkBtn">STEP OUTSIDE →</button>
    </footer>
  </div>

  <div class="instruction" id="instruction">— Tap a head to try it on, sir. —</div>
</div>

<!-- ========================== NYC ========================== -->
<div id="nyc-scene" class="scene hidden">
  <div class="skyline" id="skyline"></div>

  <div class="liberty">
    <div class="torch"></div>
    <div class="flame"></div>
    <div class="crown"></div>
    <div class="head"></div>
    <div class="body"></div>
  </div>

  <div class="sidewalk"></div>
  <div class="nyc-street"></div>

  <div class="cab">
    <div class="top-c"></div>
    <div class="body-c"></div>
    <div class="wheel left"></div>
    <div class="wheel right"></div>
  </div>

  <div class="npc left">
    <div class="speech">…sir?</div>
    <div class="head"><div class="mouth"></div></div>
    <div class="body"></div>
  </div>
  <div class="npc right">
    <div class="speech">love the new look!</div>
    <div class="head"><div class="mouth"></div></div>
    <div class="body"></div>
  </div>

  <div class="character nyc-character" id="nycPlayer">
    <div class="head" id="nycHead"></div>
    <div class="neck"></div>
    <div class="body"><div class="pocket-sq"></div></div>
    <div class="legs"><div class="leg"></div><div class="leg"></div></div>
    <div class="shoes"><div class="shoe"></div><div class="shoe"></div></div>
  </div>

  <div class="congrats" id="congrats">
    <h2>Congratulations!</h2>
    <p>You're a <em>new man</em>.<br/>Don't let it go to your Head.</p>
    <button class="replay" id="replayBtn">START OVER</button>
  </div>
</div>

<!-- Now playing strip -->
<div class="now-playing" id="nowPlaying">
  <div class="np-icon">♪</div>
  <div class="np-text">
    <div class="np-title" id="npTitle">—</div>
    <div class="np-artist" id="npArtist">—</div>
  </div>
  <div class="np-progress"><div class="np-bar" id="npBar"></div></div>
</div>

<!-- Hidden YouTube player -->
<div id="ytPlayer"></div>

<!-- Preload sprite -->
<img src="heads.png" alt="" style="display:none" />

<script>
  // 9 vagina-circle centers in source PNG (1500×1013), radius ~110px.
  const TYPES = [
    { name: 'Asymmetrical inner lips',  cx: 145,  cy: 250 },
    { name: 'Curved outer lips',         cx: 615,  cy: 250 },
    { name: 'Small, open outer lips',    cx: 1115, cy: 250 },
    { name: 'Prominent inner lips',      cx: 145,  cy: 530 },
    { name: 'Long, dangling inner lips', cx: 615,  cy: 530 },
    { name: 'Small, closed outer lips',  cx: 1115, cy: 530 },
    { name: 'Prominent outer lips',      cx: 145,  cy: 810 },
    { name: 'Long, dangling outer lips', cx: 615,  cy: 810 },
    { name: 'Visible inner lips',        cx: 1115, cy: 810 },
  ];
  const SRC_W = 1500, SRC_H = 1013, R = 110;

  // 9 upbeat bangers — 30-second clips at the hook.
  // Each index aligns with TYPES above.
  const SONGS = [
    { title: 'Mr. Blue Sky',              artist: 'Electric Light Orchestra', videoId: 'aQUlA8Hcv4s', start: 68  }, // asymmetrical
    { title: 'Uptown Funk',               artist: 'Mark Ronson ft. Bruno Mars', videoId: 'OPf0YbXqDm0', start: 35 }, // curved outer
    { title: 'Walking on Sunshine',       artist: 'Katrina & The Waves',      videoId: 'iPUmE-tne5U', start: 40  }, // small open
    { title: 'In Da Club',                artist: '50 Cent',                  videoId: '5qm8PH4xAss', start: 48  }, // prominent inner
    { title: 'Magic Carpet Ride',         artist: 'Steppenwolf',              videoId: 'LatorN4P9aA', start: 0   }, // long dangling inner
    { title: 'September',                 artist: 'Earth, Wind & Fire',       videoId: 'Gs069dndIYk', start: 8   }, // small closed
    { title: "Don't Stop Me Now",         artist: 'Queen',                    videoId: 'HgzGwKwLmgM', start: 48  }, // prominent outer
    { title: 'Y.M.C.A.',                  artist: 'Village People',           videoId: 'CS9OO0S5w2k', start: 60  }, // long dangling outer
    { title: 'I Wanna Dance with Somebody', artist: 'Whitney Houston',        videoId: 'eH3giaIzONA', start: 53  }, // visible inner
  ];
  const CLIP_LEN = 30;

  function spriteFor(idx, displaySize) {
    const t = TYPES[idx];
    const s = displaySize / (R * 2);
    return {
      size: `${SRC_W * s}px ${SRC_H * s}px`,
      pos:  `-${(t.cx - R) * s}px -${(t.cy - R) * s}px`,
    };
  }
  function paintHead(el, idx) {
    el.classList.remove('empty');
    const size = el.offsetWidth || parseFloat(getComputedStyle(el).width);
    const sp = spriteFor(idx, size);
    el.style.backgroundSize = sp.size;
    el.style.backgroundPosition = sp.pos;
    el.dataset.idx = idx;
  }

  /* ---------- Build the choice grid ---------- */
  const grid = document.getElementById('headGrid');
  const optEls = [];
  TYPES.forEach((t, idx) => {
    const opt = document.createElement('div');
    opt.className = 'head-option';
    opt.setAttribute('role', 'button');
    opt.setAttribute('tabindex', '0');
    opt.setAttribute('aria-label', t.name);

    const disc = document.createElement('div');
    disc.className = 'head-disc';
    // sizing handled responsively; compute on first paint
    opt.appendChild(disc);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = t.name;
    opt.appendChild(label);

    const choose = () => chooseHead(idx);
    opt.addEventListener('click', choose);
    opt.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        choose();
      }
    });
    grid.appendChild(opt);
    optEls.push(opt);
  });

  // Paint disc sprites once layout settles (and on resize)
  function paintDiscs() {
    optEls.forEach((opt, idx) => {
      const disc = opt.querySelector('.head-disc');
      const size = disc.offsetWidth;
      if (!size) return;
      const sp = spriteFor(idx, size);
      disc.style.backgroundSize = sp.size;
      disc.style.backgroundPosition = sp.pos;
    });
    // Player head
    const ph = document.getElementById('playerHead');
    if (ph.dataset.idx !== undefined) paintHead(ph, +ph.dataset.idx);
    const nh = document.getElementById('nycHead');
    if (nh.dataset.idx !== undefined) paintHead(nh, +nh.dataset.idx);
  }
  window.addEventListener('resize', paintDiscs);
  window.addEventListener('orientationchange', () => setTimeout(paintDiscs, 200));
  requestAnimationFrame(paintDiscs);
  setTimeout(paintDiscs, 100);
  setTimeout(paintDiscs, 500);

  /* ---------- YouTube player ---------- */
  let ytPlayer = null;
  let ytReady = false;
  let pendingSong = null;
  let stopTimer = null;

  function loadYT() {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('ytPlayer', {
      height: '180',
      width: '320',
      playerVars: {
        autoplay: 0,
        controls: 0,
        playsinline: 1,
        modestbranding: 1,
        rel: 0,
        disablekb: 1,
        fs: 0,
        iv_load_policy: 3,
      },
      events: {
        onReady: () => {
          ytReady = true;
          if (pendingSong) {
            const s = pendingSong;
            pendingSong = null;
            playSong(s);
          }
        },
        onError: (e) => {
          console.warn('YT error', e && e.data);
        },
        onStateChange: (e) => {
          // 0 = ended
          if (e.data === 0) hideNowPlaying();
        },
      }
    });
  };
  loadYT();

  function playSong(song) {
    if (!ytReady || !ytPlayer || !ytPlayer.loadVideoById) {
      pendingSong = song;
      showNowPlaying(song); // still show the title even if not yet playing
      return;
    }
    try {
      ytPlayer.loadVideoById({
        videoId: song.videoId,
        startSeconds: song.start,
        endSeconds: song.start + CLIP_LEN,
      });
      ytPlayer.unMute && ytPlayer.unMute();
      ytPlayer.setVolume && ytPlayer.setVolume(100);
    } catch (err) {
      console.warn('playSong failed', err);
    }
    showNowPlaying(song);
    if (stopTimer) clearTimeout(stopTimer);
    stopTimer = setTimeout(() => {
      try { ytPlayer.stopVideo(); } catch(_) {}
      hideNowPlaying();
    }, (CLIP_LEN + 0.4) * 1000);
  }

  function stopSong() {
    if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
    try { ytPlayer && ytPlayer.stopVideo && ytPlayer.stopVideo(); } catch(_) {}
    hideNowPlaying();
  }

  /* ---------- Now Playing UI ---------- */
  const npEl    = document.getElementById('nowPlaying');
  const npTitle = document.getElementById('npTitle');
  const npArtist= document.getElementById('npArtist');
  const npBar   = document.getElementById('npBar');

  function showNowPlaying(song) {
    npTitle.textContent  = song.title;
    npArtist.textContent = song.artist;
    npEl.classList.add('show');
    // Reset and animate progress
    npBar.style.transition = 'none';
    npBar.style.width = '0%';
    // force reflow
    void npBar.offsetWidth;
    npBar.style.transition = `width ${CLIP_LEN}s linear`;
    npBar.style.width = '100%';
  }
  function hideNowPlaying() {
    npEl.classList.remove('show');
  }

  /* ---------- Choose / walk ---------- */
  let chosenIdx = null;

  function chooseHead(idx) {
    chosenIdx = idx;
    optEls.forEach((el, i) => el.classList.toggle('chosen', i === idx));

    const head = document.getElementById('playerHead');
    paintHead(head, idx);
    head.animate(
      [
        { transform: 'translateY(-40px) scale(0.3) rotate(-20deg)', opacity: 0 },
        { transform: 'translateY(0) scale(1.2) rotate(8deg)',       opacity: 1, offset: 0.65 },
        { transform: 'translateY(0) scale(1) rotate(0deg)',          opacity: 1 },
      ],
      { duration: 600, easing: 'cubic-bezier(.34,1.56,.64,1)' }
    );

    document.getElementById('walkBtn').classList.add('show');
    document.getElementById('instruction').textContent = '— Magnificent. Step outside. —';

    // Haptic on mobile
    if (navigator.vibrate) navigator.vibrate(35);

    // Music
    playSong(SONGS[idx]);
  }

  document.getElementById('walkBtn').addEventListener('click', () => {
    if (chosenIdx === null) return;
    document.getElementById('shop-scene').classList.add('hidden');
    document.getElementById('nyc-scene').classList.remove('hidden');
    paintHead(document.getElementById('nycHead'), chosenIdx);
    setTimeout(() => document.getElementById('congrats').classList.add('show'), 900);
    if (navigator.vibrate) navigator.vibrate([40, 50, 40]);
  });

  document.getElementById('replayBtn').addEventListener('click', () => {
    document.getElementById('nyc-scene').classList.add('hidden');
    document.getElementById('congrats').classList.remove('show');
    document.getElementById('shop-scene').classList.remove('hidden');
    const head = document.getElementById('playerHead');
    head.classList.add('empty');
    head.style.backgroundImage = '';
    delete head.dataset.idx;
    document.getElementById('walkBtn').classList.remove('show');
    document.getElementById('instruction').textContent = '— Tap a head to try it on, sir. —';
    optEls.forEach(el => el.classList.remove('chosen'));
    chosenIdx = null;
    stopSong();
  });

  /* ---------- Build NYC skyline ---------- */
  const skyline = document.getElementById('skyline');
  const buildingSpecs = [
    { w: 90,  h: 260, x: 0,  empire: false },
    { w: 70,  h: 200, x: 8,  empire: false },
    { w: 110, h: 330, x: 14, empire: false },
    { w: 82,  h: 260, x: 25, empire: false },
    { w: 120, h: 450, x: 33, empire: true  },
    { w: 64,  h: 200, x: 46, empire: false },
    { w: 100, h: 320, x: 52, empire: false },
    { w: 80,  h: 250, x: 62, empire: false },
    { w: 130, h: 400, x: 70, empire: false },
    { w: 76,  h: 280, x: 84, empire: false },
    { w: 96,  h: 340, x: 91, empire: false },
  ];
  buildingSpecs.forEach(b => {
    const el = document.createElement('div');
    el.className = 'building' + (b.empire ? ' empire' : '');
    el.style.width = b.w + 'px';
    el.style.height = b.h + 'px';
    el.style.left = b.x + '%';
    if (b.empire) {
      const ant = document.createElement('div');
      ant.className = 'antenna';
      el.appendChild(ant);
    }
    skyline.appendChild(el);
  });

  /* Prevent iOS double-tap zoom on buttons */
  document.addEventListener('gesturestart', e => e.preventDefault());
</script>

</body>
</html>
